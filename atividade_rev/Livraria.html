<html>
    <head>
        <title>BookStops</title>
    </head>
    <body>
        <header>
            <h1><strong>Novos Capítulos</strong></h1>
            <p>Livros mágicos</p>
          <style>  
            body {
                background-color: rgb(87, 0, 0);rgb(214, 131, 131)rgb(185, 47, 47)rgb(61, 47, 185)rgb(46, 46, 51)
            }
            h1 { 
                color: rgba(241, 241, 210, 0.89);
            }
            p { 
                color: rgba(241, 241, 210, 0.89);
            }
          </style>
        </header>
        <img src="BookStops.png" width="630" />
        <nav>
            <a href="#">Início</a>
             <a href="#">livros</a>
              <a href="#">Carrinho</a>
              <style>
                a { 
                color: rgba(241, 241, 210, 0.89);
            }
              </style>
        </nav>
        <h2>Preferidos</h2>
        <ul>
            <li>A Hipótese do Amor</li>
            <li>Assistente do Vilão</li>
            <li>Quarta asa</li>
        </ul>

        <h2>Catálogo</h2>
        <table border="1">
            <tr>
                <th>Livro</th>
                <th>Preço</th>
            </tr>
            <tr>
                <td>A Hipótese do Amor</td>
                <td>R$ 57,00</td>
            </tr>
             <tr>
                <td>Assistente do Vilão</td>
                <td>R$ 47,19</td>
            </tr>
             <tr>
                <td>Quarta asa</td>
                <td>R$ 78,99</td>
                <style>
                td { 
                color: rgba(241, 241, 210, 0.89);
            }
            th { 
                color: rgba(241, 241, 210, 0.89);
            }
            h2 { 
                color: rgba(241, 241, 210, 0.89);
            }
            li { 
                color: rgba(241, 241, 210, 0.89);
            }
              </style>
            </tr>
        </table>

        <h2>Carrinho</h2>
        <form>
            <label>Carrinho</label>
            <input type="texto">
            <p></p>
            <label>Número de livros</label>
            <input type="number">
            <p></p>
            <label>Entrega Rápida?</label>
            <input type="radio" name="Rápida"> Sim
            <input type="radio" name="Rápida"> Não
            <p></p>
            <label>Ocasião</label>
            <select>
                <option>Presente</option>
                 <option>Padrão</option>
            </select>
            <style>
                label { 
                color: rgba(241, 241, 210, 0.89);
            }
            </style>
        </form>
        <footer>
            <p>BookStops</p>
        </footer>
    </body>
</html>
